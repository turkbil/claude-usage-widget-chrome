<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header" id="header" hidden>
    <span class="name" id="name"></span>
    <span class="pill" id="planPill" hidden></span>
  </div>

  <div class="section-head">
    <span class="section-title" id="weeklyTitle"></span>
    <span class="section-trailing" id="weeklyTrailing"></span>
  </div>
  <div class="row" id="allModelsRow" hidden>
    <span class="row-label" id="allModelsLabel"></span>
    <div class="bar"><div class="bar-fill" id="allModelsBar"></div></div>
    <span class="row-value" id="allModelsValue"></span>
  </div>
  <div class="row" id="sonnetRow" hidden>
    <span class="row-label" id="sonnetLabel"></span>
    <div class="bar"><div class="bar-fill" id="sonnetBar"></div></div>
    <span class="row-value" id="sonnetValue"></span>
  </div>

  <canvas class="sparkline" id="sparkline" width="470" height="40"></canvas>

  <div class="forecast" id="forecast" hidden></div>

  <!-- Güncel hesabın ayrıntıları: etiket solda, değer sağda. -->
  <div class="details" id="details" hidden></div>

  <div class="section-head" id="fiveHead" hidden>
    <span class="section-title" id="fiveTitle"></span>
    <span class="section-trailing" id="fiveTrailing"></span>
  </div>
  <div class="row" id="fiveRow" hidden>
    <span class="row-label" id="fiveLabel"></span>
    <div class="bar"><div class="bar-fill" id="fiveBar"></div></div>
    <span class="row-value" id="fiveValue"></span>
  </div>

  <div class="accounts" id="accounts" hidden>
    <!-- Başlık ve satırlar aynı sütun ızgarasını kullanır: başlıklar değerlerin tam üstünde. -->
    <div class="acct-grid acct-head">
      <span class="col-name" id="accountsTitle"></span>
      <span class="col-bar"></span>
      <span class="col-pct" id="colLeft"></span>
      <span class="col-reset" id="colReset"></span>
      <span class="col-plan" id="colPlan"></span>
    </div>
    <div class="note hint" id="accountsHint" hidden></div>
    <!-- Açıkken: «↺ HAFTALIK HAK» çubuk+KALAN, «↺ FABLE HAKKI» SIFIRLAMA+AYLIK sütunlarının üstünde. -->
    <div class="acct-grid grant-head" id="grantHead" hidden>
      <span class="g-weekly" id="grantHeadWeekly"></span>
      <span class="g-fable" id="grantHeadFable"></span>
    </div>
    <div id="accountRows"></div>
    <!-- «▸ Sıfırlama haklarını göster»: her hesabın altındaki hak satırını açar/kapar. -->
    <button type="button" class="show-hidden grants-toggle" id="grantsToggle" hidden></button>
    <div class="note stale" id="accountsStale" hidden></div>
    <button type="button" class="show-hidden" id="showHidden" hidden></button>
  </div>

  <div class="footer" id="footer"></div>

  <div class="actions">
    <button id="refreshBtn">⟳</button>
    <button id="openUsageBtn">claude.ai/settings/usage</button>
    <button id="optionsBtn">⚙</button>
  </div>

  <div class="credit">
    <a href="https://www.nurullah.net" id="siteLink">nurullah.net ↗</a>
    <span>·</span>
    <a href="https://x.com/nurullah" id="xLink">@nurullah ↗</a>
  </div>

  <!-- Hesap satırına tıklayınca alttan açılan seçim: Gizle · Sil · Vazgeç. -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-title" id="sheetTitle"></div>
      <p class="sheet-line" id="sheetHideText"></p>
      <p class="sheet-line" id="sheetDeleteText"></p>
      <div class="sheet-actions">
        <button type="button" id="sheetHideBtn"></button>
        <button type="button" class="danger" id="sheetDeleteBtn"></button>
        <button type="button" id="sheetCancelBtn"></button>
      </div>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
